global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: idp-app
    metrics_path: /metrics
    static_configs:
      - targets: ["idp-app:8000"]
        labels:
          service: idp-app

  - job_name: idp-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["idp-orchestrator:8001"]
        labels:
          service: idp-orchestrator

  - job_name: idp-preprocess
    metrics_path: /metrics
    static_configs:
      - targets: ["idp-preprocess:8002"]
        labels:
          service: idp-preprocess

  - job_name: idp-extraction
    metrics_path: /metrics
    static_configs:
      - targets: ["idp-extraction:8003"]
        labels:
          service: idp-extraction

  - job_name: pushgateway
    static_configs:
      - targets: ["pushgateway:9091"]
