[project]
name = "idp-preprocess"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "idp-contracts",
    "idp-common",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pillow>=10.3",
    "numpy>=1.26",
    "torch>=2.2",
    "torchvision>=0.17",
    "segmentation-models-pytorch>=0.3",
    "timm>=0.9",
]

[tool.uv.sources]
idp-contracts = { workspace = true }
idp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idp_preprocess"]
