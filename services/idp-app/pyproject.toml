[project]
name = "idp-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "idp-contracts",
    "idp-common",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[tool.uv.sources]
idp-contracts = { workspace = true }
idp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idp_app"]
