<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IDP Debug Console</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #141b24;
      --surface2: #1c2634;
      --border: #2a3648;
      --text: #e8edf4;
      --muted: #7d8fa8;
      --ok: #34d399;
      --err: #f87171;
      --warn: #fbbf24;
      --accent: #60a5fa;
      --lane-w: 220px;
      --arrow-w: 48px;
      --sidebar-w: 300px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100vh;
    }
    /* Sidebar */
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .sidebar-header {
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .sidebar-header p {
      margin: 0.25rem 0 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .job-search {
      margin: 0.75rem 1rem;
      padding: 0.5rem 0.65rem;
      width: calc(100% - 2rem);
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.8rem;
    }
    .job-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.5rem 1rem;
    }
    .job-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.35rem;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }
    .job-item:hover { background: var(--surface2); }
    .job-item.active {
      background: #1e3a5f;
      border-color: #2563eb;
    }
    .job-item-id {
      font-size: 0.7rem;
      font-family: ui-monospace, monospace;
      color: var(--muted);
      word-break: break-all;
    }
    .job-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }
    .job-item-time { font-size: 0.7rem; color: var(--muted); }
    .status-pill {
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      background: #243044;
      color: var(--muted);
      white-space: nowrap;
    }
    .status-pill.COMPLETED, .status-pill.EXTRACTED { color: var(--ok); background: #064e3b33; }
    .status-pill.FAILED, .status-pill.EXTRACTION_FAILED { color: var(--err); background: #7f1d1d33; }
    .status-pill.PENDING, .status-pill.BATCHING, .status-pill.EXTRACTING { color: var(--warn); background: #78350f33; }

    /* Main */
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .toolbar {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .toolbar h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .toolbar-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.75rem;
    }
    .chip {
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .chip code { color: var(--accent); font-size: 0.7rem; }
    .toolbar-actions { margin-left: auto; display: flex; gap: 0.5rem; }
    .btn {
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: #1d4ed8; border-color: #2563eb; }

    .workflow-wrap {
      flex: 1;
      overflow: auto;
      padding: 1.25rem;
      min-height: 0;
    }
    .workflow {
      display: flex;
      align-items: stretch;
      min-width: max-content;
      padding-bottom: 0.5rem;
    }
    .lane {
      width: var(--lane-w);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .lane-header {
      text-align: center;
      padding: 0.65rem 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px 10px 0 0;
    }
    .lane-header .name {
      font-weight: 700;
      font-size: 0.85rem;
    }
    .lane-header .sub {
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    .lane-body {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      min-height: 200px;
    }
    .arrow-col {
      width: var(--arrow-w);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .arrow-col svg { opacity: 0.6; }

    .ev-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.55rem;
      cursor: pointer;
      transition: border-color 0.15s;
      font-size: 0.72rem;
    }
    .ev-card:hover { border-color: var(--accent); }
    .ev-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .ev-card.error { border-left: 3px solid var(--err); }
    .ev-card.success { border-left: 3px solid var(--ok); }
    .ev-step {
      font-weight: 600;
      font-size: 0.72rem;
      line-height: 1.3;
      margin-bottom: 0.25rem;
      word-break: break-word;
    }
    .ev-meta {
      color: var(--muted);
      font-size: 0.65rem;
      display: flex;
      justify-content: space-between;
      gap: 0.25rem;
    }
    .lane-empty {
      color: var(--muted);
      font-size: 0.7rem;
      text-align: center;
      padding: 1rem 0.25rem;
      font-style: italic;
    }

    .detail-panel {
      border-top: 1px solid var(--border);
      background: var(--surface);
      max-height: 240px;
      overflow: auto;
      padding: 0.75rem 1.25rem;
      font-size: 0.75rem;
    }
    .detail-panel h3 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 900px) {
      .detail-grid { grid-template-columns: 1fr; }
    }
    pre {
      margin: 0;
      padding: 0.6rem;
      background: var(--bg);
      border-radius: 6px;
      overflow: auto;
      max-height: 160px;
      font-size: 0.68rem;
    }
    .placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 2rem;
      text-align: center;
    }
    .empty-jobs {
      padding: 1.5rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>IDP Debug</h1>
        <p>Chọn job để xem workflow</p>
      </div>
      <input type="search" class="job-search" id="job-search" placeholder="Tìm job id / status…" />
      <div class="job-list" id="job-list"></div>
    </aside>

    <div class="main">
      <div class="toolbar" id="toolbar" hidden>
        <h2 id="toolbar-title">Workflow</h2>
        <div class="toolbar-meta" id="toolbar-meta"></div>
        <div class="toolbar-actions">
          <button class="btn" id="btn-refresh" type="button">Refresh</button>
          <a class="btn" id="link-json" href="#" target="_blank">Job JSON</a>
        </div>
      </div>

      <div class="workflow-wrap" id="workflow-wrap">
        <div class="placeholder" id="placeholder">← Chọn một job từ danh sách bên trái</div>
        <div class="workflow" id="workflow" hidden></div>
      </div>

      <div class="detail-panel" id="detail-panel" hidden>
        <h3 id="detail-title">Event detail</h3>
        <div class="detail-grid">
          <div>
            <div style="color:var(--muted);margin-bottom:0.25rem">Request</div>
            <pre id="detail-req">{}</pre>
          </div>
          <div>
            <div style="color:var(--muted);margin-bottom:0.25rem">Response</div>
            <pre id="detail-res">{}</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LANES = [
      { id: "idp-app", label: "idp-app", sub: "API · rules · callback" },
      { id: "idp-orchestrator", label: "orchestrator", sub: "Redis · batching" },
      { id: "idp-preprocess", label: "preprocess", sub: "Download · GCS · fraud" },
      { id: "idp-extraction", label: "extraction", sub: "GCS · batch infer" },
      { id: "lmdeploy", label: "LMDeploy", sub: "RunPod VLM" },
    ];

    const ARROW_SVG = `<svg width="32" height="24" viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 12H24M24 12L16 4M24 12L16 20" stroke="currentColor" stroke-width="2"/>
    </svg>`;

    let allJobs = [];
    let selectedJobId = null;
    let selectedEventId = null;
    let pollTimer = null;

    function parseJobIdFromPath() {
      const m = window.location.pathname.match(/\/debug\/jobs\/([0-9a-f-]{36})/i);
      return m ? m[1] : null;
    }

    function fmtTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleTimeString() + "." + String(d.getMilliseconds()).padStart(3, "0");
    }

    function fmtDate(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleString();
    }

    function laneForEvent(ev) {
      if ((ev.step || "").toLowerCase().includes("lmdeploy")) return "lmdeploy";
      return ev.service;
    }

    function shortStep(step) {
      if (!step) return "";
      return step
        .replace("POST /internal/v1/jobs/start", "start job")
        .replace("POST /v1/batch/extract", "batch extract")
        .replace("POST /internal/v1/jobs/complete", "complete webhook")
        .replace("POST /v1/jobs", "create job");
    }

    function selectJob(jobId, pushUrl = true) {
      selectedJobId = jobId;
      selectedEventId = null;
      if (pushUrl) {
        const url = jobId ? `/debug/jobs/${jobId}` : "/debug";
        window.history.pushState({}, "", url);
      }
      document.querySelectorAll(".job-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.jobId === jobId);
      });
      if (jobId) loadTimeline();
      else showPlaceholder();
    }

    function showPlaceholder() {
      document.getElementById("placeholder").hidden = false;
      document.getElementById("workflow").hidden = true;
      document.getElementById("toolbar").hidden = true;
      document.getElementById("detail-panel").hidden = true;
    }

    function renderJobList(jobs) {
      const q = (document.getElementById("job-search").value || "").toLowerCase();
      const filtered = jobs.filter((j) => {
        if (!q) return true;
        return (
          j.job_id.toLowerCase().includes(q) ||
          (j.status || "").toLowerCase().includes(q) ||
          (j.tenant_id || "").toLowerCase().includes(q)
        );
      });
      const el = document.getElementById("job-list");
      if (!filtered.length) {
        el.innerHTML = `<div class="empty-jobs">${jobs.length ? "Không khớp tìm kiếm" : "Chưa có job"}</div>`;
        return;
      }
      el.innerHTML = filtered
        .map(
          (j) => `
        <button type="button" class="job-item ${j.job_id === selectedJobId ? "active" : ""}"
                data-job-id="${j.job_id}">
          <div class="job-item-row">
            <span class="status-pill ${j.status}">${j.status}</span>
            <span class="job-item-time">${fmtTime(j.created_at)}</span>
          </div>
          <div class="job-item-id">${j.job_id}</div>
        </button>`
        )
        .join("");
      el.querySelectorAll(".job-item").forEach((btn) => {
        btn.addEventListener("click", () => selectJob(btn.dataset.jobId));
      });
    }

    function renderWorkflow(events, traceId) {
      document.getElementById("placeholder").hidden = true;
      document.getElementById("workflow").hidden = false;
      document.getElementById("toolbar").hidden = false;

      document.getElementById("toolbar-title").textContent = `Job ${selectedJobId.slice(0, 8)}…`;
      document.getElementById("toolbar-meta").innerHTML = `
        <span class="chip">Events: <strong>${events.length}</strong></span>
        ${traceId ? `<span class="chip">Trace: <code>${String(traceId).slice(0, 8)}…</code></span>` : ""}
      `;
      document.getElementById("link-json").href = `/v1/jobs/${selectedJobId}`;

      const byLane = {};
      LANES.forEach((l) => (byLane[l.id] = []));
      events.forEach((ev) => {
        const lane = laneForEvent(ev);
        if (!byLane[lane]) byLane[lane] = [];
        byLane[lane].push(ev);
      });
      Object.values(byLane).forEach((arr) =>
        arr.sort((a, b) => new Date(a.started_at) - new Date(b.started_at))
      );

      const wf = document.getElementById("workflow");
      wf.innerHTML = "";
      LANES.forEach((lane, idx) => {
        if (idx > 0) {
          const arrow = document.createElement("div");
          arrow.className = "arrow-col";
          arrow.innerHTML = ARROW_SVG;
          arrow.title = `${LANES[idx - 1].label} → ${lane.label}`;
          wf.appendChild(arrow);
        }
        const col = document.createElement("div");
        col.className = "lane";
        const items = byLane[lane.id] || [];
        col.innerHTML = `
          <div class="lane-header">
            <div class="name">${lane.label}</div>
            <div class="sub">${lane.sub}</div>
          </div>
          <div class="lane-body" data-lane="${lane.id}">
            ${
              items.length
                ? items.map((ev) => renderEventCard(ev)).join("")
                : `<div class="lane-empty">—</div>`
            }
          </div>`;
        wf.appendChild(col);
      });

      wf.querySelectorAll(".ev-card").forEach((card) => {
        card.addEventListener("click", () => {
          const id = Number(card.dataset.eventId);
          selectedEventId = id;
          wf.querySelectorAll(".ev-card").forEach((c) => c.classList.remove("selected"));
          card.classList.add("selected");
          const ev = events.find((e) => e.id === id);
          if (ev) showEventDetail(ev);
        });
      });
    }

    function renderEventCard(ev) {
      const st = ev.status === "error" ? "error" : ev.status === "success" ? "success" : "";
      return `
        <div class="ev-card ${st}" data-event-id="${ev.id}" title="${ev.step}">
          <div class="ev-step">${shortStep(ev.step)}</div>
          <div class="ev-meta">
            <span>${ev.direction}</span>
            <span>${ev.duration_ms != null ? ev.duration_ms + "ms" : fmtTime(ev.started_at)}</span>
          </div>
          ${ev.error ? `<div style="color:var(--err);margin-top:0.2rem;font-size:0.65rem">${escapeHtml(ev.error.slice(0, 80))}</div>` : ""}
        </div>`;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showEventDetail(ev) {
      const panel = document.getElementById("detail-panel");
      panel.hidden = false;
      document.getElementById("detail-title").textContent = `${ev.service} · ${ev.step}`;
      document.getElementById("detail-req").textContent = JSON.stringify(ev.request || {}, null, 2);
      document.getElementById("detail-res").textContent = JSON.stringify(
        { ...(ev.response || {}), ...(ev.error ? { error: ev.error } : {}) },
        null,
        2
      );
    }

    async function loadJobs() {
      try {
        const resp = await fetch("/v1/jobs?limit=50");
        if (!resp.ok) throw new Error(await resp.text());
        const data = await resp.json();
        allJobs = data.jobs || [];
        renderJobList(allJobs);
      } catch (e) {
        document.getElementById("job-list").innerHTML =
          `<div class="empty-jobs">Lỗi tải jobs: ${escapeHtml(e.message)}</div>`;
      }
    }

    async function loadTimeline() {
      if (!selectedJobId) return;
      try {
        const resp = await fetch(`/v1/jobs/${selectedJobId}/debug-timeline`);
        if (!resp.ok) throw new Error(await resp.text());
        const data = await resp.json();
        renderWorkflow(data.events || [], data.trace_id);
        if (selectedEventId) {
          const ev = (data.events || []).find((e) => e.id === selectedEventId);
          if (ev) showEventDetail(ev);
        }
      } catch (e) {
        document.getElementById("workflow").innerHTML =
          `<div class="placeholder">Lỗi timeline: ${escapeHtml(e.message)}</div>`;
        document.getElementById("workflow").hidden = false;
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        loadJobs();
        if (selectedJobId) loadTimeline();
      }, 5000);
    }

    document.getElementById("job-search").addEventListener("input", () => renderJobList(allJobs));
    document.getElementById("btn-refresh").addEventListener("click", () => {
      loadJobs();
      loadTimeline();
    });
    window.addEventListener("popstate", () => {
      const id = parseJobIdFromPath();
      selectJob(id, false);
    });

    (async function init() {
      await loadJobs();
      const fromUrl = parseJobIdFromPath();
      if (fromUrl) selectJob(fromUrl, false);
      else if (allJobs.length) selectJob(allJobs[0].job_id, false);
      startPolling();
    })();
  </script>
</body>
</html>
