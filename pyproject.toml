[project]
name = "nexts-system-idp"
version = "0.1.0"
description = "Production IDP pipeline for invoice extraction"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/idp-contracts",
    "packages/idp-common",
    "services/idp-app",
    "services/idp-orchestrator",
    "services/idp-preprocess",
    "services/idp-extraction",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
